<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Precision" />
  <meta name="theme-color" content="#02070d" />
  <title>Precision</title>
  <link rel="apple-touch-icon" id="appleIcon" href="" />
  <style>
    :root {
      --bg: #02070d;
      --panel: #07111d;
      --panel-2: #0b1725;
      --line: rgba(125, 221, 255, 0.18);
      --ice: #7ddfff;
      --ice-2: #bdefff;
      --text: #edfaff;
      --muted: #87a5b4;
      --danger: #ff5d7a;
      --shadow: 0 18px 55px rgba(0, 0, 0, .35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(125,223,255,.11), transparent 38%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    .app { min-height: 100vh; padding: env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
    header { position: sticky; top: 0; z-index: 20; padding: 14px 0 10px; backdrop-filter: blur(18px); background: linear-gradient(to bottom, rgba(2,7,13,.94), rgba(2,7,13,.72), transparent); }
    .brand { display:flex; align-items:center; gap: 12px; }
    .mark { width: 46px; height:46px; border: 1px solid var(--ice); border-radius:50%; display:grid; place-items:center; position:relative; box-shadow:0 0 18px rgba(125,223,255,.22); flex: 0 0 auto; }
    .mark:before, .mark:after { content:""; position:absolute; background: var(--ice); left:50%; top:50%; transform-origin:left center; }
    .mark:before { width: 14px; height:2px; transform: rotate(-90deg); }
    .mark:after { width: 11px; height:2px; transform: rotate(25deg); }
    .mark span { font-weight: 900; color: var(--ice-2); font-size: 14px; text-shadow: 0 0 10px rgba(125,223,255,.45); }
    h1 { margin:0; font-size: 24px; letter-spacing: .03em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .top-actions { margin-left:auto; display:flex; gap:8px; }
    .pill { border:1px solid var(--line); background: rgba(7,17,29,.85); color: var(--ice); border-radius:999px; padding: 9px 11px; font-weight:700; }
    .card { background: linear-gradient(180deg, rgba(11,23,37,.96), rgba(7,17,29,.96)); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin: 12px 0; }
    .row { display:flex; gap: 10px; align-items:center; }
    .between { justify-content: space-between; }
    .stack { display:flex; flex-direction:column; gap:10px; }
    h2 { font-size: 18px; margin: 2px 0 12px; }
    h3 { font-size: 15px; margin: 8px 0; color: var(--ice-2); }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); background: #030a12; color: var(--text); border-radius: 13px; padding: 12px; outline: none;
    }
    textarea { min-height: 92px; resize: vertical; }
    .btn { border: 1px solid rgba(125,223,255,.38); background: rgba(125,223,255,.08); color: var(--ice-2); border-radius: 13px; padding: 11px 13px; font-weight: 800; cursor:pointer; }
    .btn.primary { background: linear-gradient(135deg, rgba(125,223,255,.22), rgba(125,223,255,.05)); color: white; }
    .btn.danger { border-color: rgba(255,93,122,.35); color: #ffc3cf; background: rgba(255,93,122,.08); }
    .btn.icon { width:42px; min-width:42px; padding: 10px; }
    .tab { display:none; }
    .tab.active { display:block; animation: fade .18s ease; }
    @keyframes fade { from { opacity:.2; transform: translateY(4px);} to {opacity:1; transform:translateY(0);} }
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(2,7,13,.92); backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
    .nav-scroll { display:flex; gap: 8px; overflow-x:auto; max-width: 760px; margin: 0 auto; padding-bottom: 2px; }
    .nav-scroll::-webkit-scrollbar { display:none; }
    .navbtn { flex: 0 0 auto; border:1px solid var(--line); background: rgba(7,17,29,.8); color: var(--muted); border-radius: 999px; padding: 11px 13px; font-weight: 800; font-size: 13px; }
    .navbtn.active { color: var(--bg); background: var(--ice); border-color: var(--ice); }
    .item { border:1px solid var(--line); background: rgba(2,7,13,.5); border-radius: 15px; padding: 11px; margin: 8px 0; }
    .check { width: 26px; height:26px; border:1px solid var(--ice); border-radius:8px; display:grid; place-items:center; color: var(--bg); flex:0 0 auto; }
    .done .check { background: var(--ice); }
    .done .title { text-decoration: line-through; color: var(--muted); }
    .title { font-weight: 800; }
    .meta { color: var(--muted); font-size:12px; margin-top:3px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
    .calendar { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .dayhead { text-align:center; color:var(--muted); font-size:11px; padding: 6px 0; }
    .day { min-height: 58px; border:1px solid var(--line); border-radius: 12px; padding: 6px; background: rgba(2,7,13,.48); position:relative; }
    .day.today { border-color: var(--ice); box-shadow:0 0 0 1px rgba(125,223,255,.2) inset; }
    .date-num { font-weight: 900; font-size:12px; }
    .dots { display:flex; gap:3px; flex-wrap:wrap; margin-top: 5px; }
    .dot { width:9px; height:9px; border-radius:50%; }
    .cal-event { font-size:10px; line-height:1.1; margin-top:4px; color:#dff8ff; word-break:break-word; }
    .planner-row { display:grid; grid-template-columns: 58px 1fr; gap:8px; align-items:start; padding: 7px 0; border-bottom:1px solid rgba(125,223,255,.08); }
    .time { color: var(--ice); font-size: 12px; font-weight: 900; padding-top: 12px; }
    .slot { min-height: 42px; padding: 9px; }
    .planner-tools { position: sticky; top: 76px; z-index: 18; background: rgba(7,17,29,.94); backdrop-filter: blur(14px); }
    .planner-row.blocked { background: rgba(125,223,255,.045); border-left: 2px solid var(--ice); border-right: 2px solid var(--ice); padding-left: 7px; padding-right: 7px; }
    .planner-row.block-start { border-top: 2px solid var(--ice); border-top-left-radius: 14px; border-top-right-radius: 14px; margin-top: 8px; }
    .planner-row.block-end { border-bottom: 2px solid var(--ice); border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; margin-bottom: 8px; }
    .planner-block-label { font-size: 11px; color: var(--ice-2); margin: 0 0 6px; font-weight: 900; letter-spacing:.02em; }

    .file-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:5px; }
    .file-tab { flex:0 0 auto; }
    .tag { display:inline-block; border:1px solid var(--line); color:var(--ice-2); border-radius:999px; padding:3px 8px; font-size:11px; margin-right:4px; }
    .colour { width:34px; height:34px; border-radius: 10px; border:1px solid rgba(255,255,255,.25); }
    .swatch { width: 100%; height: 36px; border-radius: 11px; border:1px solid var(--line); }
    .review-type { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .hidden { display:none !important; }
    @media (min-width: 700px) { .calendar .day { min-height: 80px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark"><span>90</span></div>
        <div><h1>Precision</h1><div class="sub" id="dateLine"></div></div>
        <div class="top-actions"><button class="pill" onclick="exportData()">Export</button></div>
      </div>
    </header>

    <main>
      <section id="daily" class="tab active"></section>
      <section id="planner" class="tab"></section>
      <section id="todos" class="tab"></section>
      <section id="calendar" class="tab"></section>
      <section id="shifts" class="tab"></section>
      <section id="habits" class="tab"></section>
      <section id="reviews" class="tab"></section>
      <section id="notes" class="tab"></section>
    </main>
  </div>

  <nav><div class="nav-scroll" id="nav"></div></nav>

<script>
const KEY = 'precision_app_v1';
const todayKey = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
function dateFromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function keyFromDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDaysKey(k,n){ const d=dateFromKey(k); d.setDate(d.getDate()+n); return keyFromDate(d); }
function timeLabelFromIndex(i){ const mins=i*15; const h=Math.floor(mins/60), m=mins%60; return `${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}`; }
function timeRangeEndFromIndex(i){ if(i>=96) return '2400'; return timeLabelFromIndex(i); }

const colours = ['#7ddfff','#37ff8b','#ffd166','#ff5d7a','#b388ff','#ff9f1c','#f72585','#4cc9f0'];
const tabs = [
  ['daily','Daily tasks'], ['planner','Daily planner'], ['todos','Todo lists'], ['calendar','Calendar'], ['shifts','Shifts'], ['habits','Habits'], ['reviews','Reviews'], ['notes','Notes section']
];
let state = load();
let activeDate = todayKey();
let calendarMonth = '2026-01';
let activeTodoFile = state.todoFiles[0]?.id || 'work';

function load(){
  const saved = localStorage.getItem(KEY);
  if(saved) return JSON.parse(saved);
  return {
    dailyTasks: {},
    planner: {},
    habits: [
      {id: uid(), name:'Exercise', order:1}, {id: uid(), name:'Hydration', order:2}, {id: uid(), name:'Hot/cold therapy', order:3}, {id: uid(), name:'Pray/mindfulness', order:4}
    ],
    habitChecks: {},
    todoFiles: [{id:'work', name:'Work'}, {id:'home', name:'Home'}],
    todos: {},
    calendarEvents: [],
    shifts: [],
    reviews: {},
    notes: {},
    dailyNotes: {}
  };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function el(id){ return document.getElementById(id); }

function init(){
  buildIcon();
  el('dateLine').textContent = fmtDate(todayKey());
  el('nav').innerHTML = tabs.map(([id,label]) => `<button class="navbtn ${id==='daily'?'active':''}" onclick="showTab('${id}')">${label}</button>`).join('');
  render();
}
function showTab(id){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id===id));
  document.querySelectorAll('.navbtn').forEach((b,i)=> b.classList.toggle('active', tabs[i][0]===id));
  render();
}
function datePicker(){ return `<div class="card"><div class="row between"><button class="btn icon" onclick="shiftDate(-1)">‹</button><input type="date" value="${activeDate}" onchange="activeDate=this.value; render()"><button class="btn icon" onclick="shiftDate(1)">›</button></div></div>`; }
function shiftDate(n){ activeDate=addDaysKey(activeDate,n); calendarMonth=activeDate.slice(0,7); render(); }

function render(){
  renderDaily(); renderPlanner(); renderTodos(); renderCalendar(); renderShifts(); renderHabits(); renderReviews(); renderNotes();
}
function renderDaily(){
  const list = state.dailyTasks[activeDate] || [];
  const habitList = state.habits.sort((a,b)=>a.order-b.order).map(h => habitItem(h)).join('');
  el('daily').innerHTML = datePicker()+`
    <div class="card"><h2>Daily checklist</h2>
      <div class="row"><input id="newDaily" placeholder="Add daily task"><button class="btn primary" onclick="addDailyTask()">+</button></div>
      ${list.map(t => taskItem(t, 'daily')).join('') || '<p class="muted small">No daily tasks yet.</p>'}
    </div>
    <div class="card"><h2>Today’s habits</h2>${habitList}</div>
    <div class="card"><h2>Daily notes</h2><textarea placeholder="Notes for today..." oninput="state.dailyNotes[activeDate]=this.value; persistOnly()">${state.dailyNotes[activeDate]||''}</textarea></div>`;
}
function addDailyTask(){ const v=el('newDaily').value.trim(); if(!v) return; state.dailyTasks[activeDate] ||= []; state.dailyTasks[activeDate].push({id:uid(), title:v, done:false}); save(); }
function taskItem(t, type, fileId=''){
  const reorder = type==='daily' ? `<button class="btn icon" onclick="moveDailyTask('${t.id}',-1)">↑</button><button class="btn icon" onclick="moveDailyTask('${t.id}',1)">↓</button>` : '';
  return `<div class="item ${t.done?'done':''}"><div class="row">
    <button class="check" onclick="toggleTask('${type}','${t.id}','${fileId}')">${t.done?'✓':''}</button>
    <div style="flex:1"><div class="title">${escapeHtml(t.title)}</div>${t.label?`<div class="meta"><span class="tag">${t.label}</span></div>`:''}</div>
    ${reorder}<button class="btn icon danger" onclick="deleteTask('${type}','${t.id}','${fileId}')">×</button>
  </div></div>`;
}
function moveDailyTask(id,dir){ const arr=state.dailyTasks[activeDate]||[]; const i=arr.findIndex(t=>t.id===id); const j=i+dir; if(i<0||j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; save(); }
function toggleTask(type,id,fileId){ let arr = type==='daily'?state.dailyTasks[activeDate]:state.todos[fileId]; const t=arr.find(x=>x.id===id); t.done=!t.done; save(); }
function deleteTask(type,id,fileId){ if(type==='daily') state.dailyTasks[activeDate]=state.dailyTasks[activeDate].filter(x=>x.id!==id); else state.todos[fileId]=state.todos[fileId].filter(x=>x.id!==id); save(); }

function renderPlanner(){
  const blocks = plannerBlocksForDate(activeDate);
  const blockByIndex = {};
  blocks.forEach(b => { for(let i=b.startIndex; i<b.endIndex; i++) blockByIndex[i]=b; });
  let slots='';
  for(let h=0; h<24; h++) for(let m=0; m<60; m+=15){
    const index = h*4 + m/15;
    const time = `${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}`;
    const key = activeDate+'_'+time;
    const b = blockByIndex[index];
    const cls = b ? ` blocked ${index===b.startIndex?'block-start':''} ${index===b.endIndex-1?'block-end':''}` : '';
    const label = b && index===b.startIndex ? `<div class="planner-block-label">${escapeHtml(b.title)} · ${b.start}–${b.end}</div>` : '';
    slots += `<div class="planner-row${cls}" id="slot-${time}"><div class="time">${time}</div><div>${label}<textarea class="slot" placeholder="Plan..." oninput="updatePlannerSlot('${key}', this.value)">${state.planner[key]||''}</textarea></div></div>`;
  }
  el('planner').innerHTML = datePicker()+`<div class="card planner-tools"><h2>Daily planner</h2><p class="muted small">15-minute increments from 0000–2345. Repeating the same text in consecutive blocks groups it into one block and links it to the calendar.</p><div class="grid2"><select id="jumpTime">${Array.from({length:24},(_,h)=>`<option value="${String(h).padStart(2,'0')}00">${String(h).padStart(2,'0')}00</option>`).join('')}</select><button class="btn primary" onclick="jumpToPlannerTime()">Go to time</button></div></div><div class="card">${slots}</div>`;
}
function updatePlannerSlot(key,value){ state.planner[key]=value; persistOnly(); }
function jumpToPlannerTime(){ const v=el('jumpTime').value; const target=document.getElementById('slot-'+v); if(target) target.scrollIntoView({behavior:'smooth', block:'start'}); }
function plannerBlocksForDate(date){
  const blocks=[]; let current=null;
  for(let i=0;i<96;i++){
    const time=timeLabelFromIndex(i); const raw=state.planner[date+'_'+time]||''; const title=raw.trim();
    if(title){
      if(current && current.title.toLowerCase()===title.toLowerCase()){ current.endIndex=i+1; current.end=timeRangeEndFromIndex(i+1); }
      else { if(current) blocks.push(current); current={title, startIndex:i, endIndex:i+1, start:time, end:timeRangeEndFromIndex(i+1), colour:'#7ddfff'}; }
    } else { if(current){ blocks.push(current); current=null; } }
  }
  if(current) blocks.push(current);
  return blocks;
}

function renderTodos(){
  if(!state.todoFiles.find(f=>f.id===activeTodoFile)) activeTodoFile = state.todoFiles[0]?.id || 'work';
  const files = state.todoFiles.map(f=>`<button class="btn file-tab ${activeTodoFile===f.id?'primary':''}" onclick="activeTodoFile='${f.id}'; render()">${escapeHtml(f.name)}</button>`).join('');
  const tasks = state.todos[activeTodoFile] || [];
  el('todos').innerHTML = `<div class="card"><h2>Todo lists</h2><div class="file-tabs">${files}<button class="btn" onclick="addTodoFile()">+ File</button></div></div>
    <div class="card"><div class="grid2"><input id="todoText" placeholder="Add task"><select id="todoLabel"><option>To be done today</option><option>To be done this week</option><option>To be done this month</option></select></div><button class="btn primary" style="width:100%; margin-top:10px" onclick="addTodo()">Add todo</button></div>
    <div class="card"><h2>${escapeHtml(state.todoFiles.find(f=>f.id===activeTodoFile)?.name||'File')}</h2>${tasks.map(t=>taskItem(t,'todo',activeTodoFile)).join('') || '<p class="muted small">No tasks in this file yet.</p>'}<button class="btn danger" onclick="deleteTodoFile()">Delete this file</button></div>`;
}
function addTodoFile(){ const name=prompt('File name?'); if(!name) return; const id=uid(); state.todoFiles.push({id,name}); activeTodoFile=id; save(); }
function deleteTodoFile(){ if(state.todoFiles.length<=1) return alert('Keep at least one file.'); state.todoFiles=state.todoFiles.filter(f=>f.id!==activeTodoFile); delete state.todos[activeTodoFile]; activeTodoFile=state.todoFiles[0].id; save(); }
function addTodo(){ const title=el('todoText').value.trim(); if(!title) return; state.todos[activeTodoFile] ||= []; state.todos[activeTodoFile].push({id:uid(), title, label:el('todoLabel').value, done:false}); save(); }

function renderCalendar(){
  const [y,m] = calendarMonth.split('-').map(Number);
  const first = new Date(y,m-1,1); const last = new Date(y,m,0); const startPad=(first.getDay()+6)%7;
  let cells = Array(startPad).fill('<div></div>');
  for(let d=1; d<=last.getDate(); d++){
    const date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events=calendarEventsFor(date);
    cells.push(`<div class="day ${date===todayKey()?'today':''}" onclick="openCalendarDay('${date}')"><div class="date-num">${d}</div><div class="dots">${events.slice(0,4).map(e=>`<span class="dot" style="background:${e.colour}"></span>`).join('')}</div>${events.slice(0,2).map(e=>`<div class="cal-event">${escapeHtml(e.title)}</div>`).join('')}</div>`);
  }
  el('calendar').innerHTML = `<div class="card"><div class="row between"><button class="btn icon" onclick="moveMonth(-1)">‹</button><h2>${first.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</h2><button class="btn icon" onclick="moveMonth(1)">›</button></div></div>
    <div class="card"><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div>
    <div class="card"><h2>Add calendar item</h2><input id="calDate" type="date" value="${activeDate}"><input id="calTitle" placeholder="Item title" style="margin-top:8px"><div class="grid3" style="margin-top:8px">${colours.map(c=>`<button class="swatch" style="background:${c}" onclick="document.querySelector('#calColour').value='${c}'"></button>`).join('')}</div><input id="calColour" value="#7ddfff" style="margin-top:8px"><button class="btn primary" style="width:100%; margin-top:10px" onclick="addCalendarEvent()">Add item</button></div>`;
}
function moveMonth(n){ const [y,m]=calendarMonth.split('-').map(Number); const d=new Date(y,m-1+n,1); calendarMonth=keyFromDate(d).slice(0,7); render(); }
function calendarEventsFor(date){
  const plannerBlocks = plannerBlocksForDate(date).map(b=>({title:`${b.title} ${b.start}–${b.end}`, colour:'#7ddfff', type:'planner'}));
  return [...state.calendarEvents.filter(e=>e.date===date), ...state.shifts.filter(s=>s.date===date).map(s=>({title:`Shift ${s.start}–${s.end}`, colour:'#7ddfff'})), ...plannerBlocks];
}
function addCalendarEvent(){ const date=el('calDate').value, title=el('calTitle').value.trim(), colour=el('calColour').value; if(!date||!title) return; state.calendarEvents.push({id:uid(), date, title, colour}); save(); }
function openCalendarDay(date){ activeDate=date; alert(fmtDate(date)+'\n\nItems:\n'+(calendarEventsFor(date).map(e=>'• '+e.title).join('\n') || 'No items yet.')); }

function renderShifts(){
  el('shifts').innerHTML = `<div class="card"><h2>Shifts</h2><p class="muted small">Shifts added here automatically show on the calendar.</p><div class="grid2"><input id="shiftDate" type="date" value="${activeDate}"><input id="shiftStart" type="time"></div><div class="grid2" style="margin-top:8px"><input id="shiftEnd" type="time"><input id="shiftNote" placeholder="Notes / location"></div><button class="btn primary" style="width:100%; margin-top:10px" onclick="addShift()">Add shift</button></div>
    <div class="card"><h2>Upcoming shifts</h2>${state.shifts.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(s=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${fmtDate(s.date)} · ${s.start}–${s.end}</div><div class="meta">${escapeHtml(s.note||'')}</div></div><button class="btn icon danger" onclick="deleteShift('${s.id}')">×</button></div></div>`).join('') || '<p class="muted small">No shifts added.</p>'}</div>`;
}
function addShift(){ const date=el('shiftDate').value, start=el('shiftStart').value, end=el('shiftEnd').value, note=el('shiftNote').value; if(!date||!start||!end) return; state.shifts.push({id:uid(), date, start, end, note}); calendarMonth=date.slice(0,7); save(); }
function deleteShift(id){ state.shifts=state.shifts.filter(s=>s.id!==id); save(); }

function renderHabits(){
  el('habits').innerHTML = `<div class="card"><h2>Habits</h2><div class="row"><input id="newHabit" placeholder="Add habit"><button class="btn primary" onclick="addHabit()">+</button></div>${state.habits.sort((a,b)=>a.order-b.order).map(h=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${escapeHtml(h.name)}</div><div class="meta">Current streak: ${streakForHabit(h.id)} days</div></div><button class="btn icon" onclick="moveHabit('${h.id}',-1)">↑</button><button class="btn icon" onclick="moveHabit('${h.id}',1)">↓</button><button class="btn icon danger" onclick="deleteHabit('${h.id}')">×</button></div></div>`).join('')}</div>`;
}
function habitItem(h){ const checked=!!state.habitChecks[activeDate]?.[h.id]; return `<div class="item ${checked?'done':''}"><div class="row"><button class="check" onclick="toggleHabit('${h.id}')">${checked?'✓':''}</button><div style="flex:1"><div class="title">${escapeHtml(h.name)}</div><div class="meta">Streak: ${streakForHabit(h.id)} days</div></div></div></div>`; }
function addHabit(){ const name=el('newHabit').value.trim(); if(!name) return; state.habits.push({id:uid(), name, order:state.habits.length+1}); save(); }
function deleteHabit(id){ state.habits=state.habits.filter(h=>h.id!==id); Object.values(state.habitChecks).forEach(day=>delete day[id]); save(); }
function moveHabit(id,dir){ const h=state.habits.find(x=>x.id===id); h.order += dir*1.5; state.habits.sort((a,b)=>a.order-b.order).forEach((x,i)=>x.order=i+1); save(); }
function toggleHabit(id){ state.habitChecks[activeDate] ||= {}; state.habitChecks[activeDate][id] = !state.habitChecks[activeDate][id]; save(); }
function streakForHabit(id){ let streak=0; const d=dateFromKey(todayKey()); while(true){ const k=keyFromDate(d); if(state.habitChecks[k]?.[id]) { streak++; d.setDate(d.getDate()-1); } else break; } return streak; }
function dailyTaskStreak(){ let streak=0; const d=dateFromKey(todayKey()); while(true){ const k=keyFromDate(d); const arr=state.dailyTasks[k]||[]; if(arr.length && arr.every(t=>t.done)) { streak++; d.setDate(d.getDate()-1); } else break; } return streak; }

function renderReviews(){
  const r = state.reviews[activeDate] || {};
  const weekSummary = weeklySummary();
  el('reviews').innerHTML = datePicker()+`<div class="card"><h2>Reviews</h2><div class="review-type"><button class="btn primary" onclick="toggleReview('morningBox')">+ Morning review</button><button class="btn primary" onclick="toggleReview('nightBox')">+ Night review</button></div></div>
  <div class="card" id="morningBox"><h2>Morning review</h2><input placeholder="Top priority 1" value="${r.p1||''}" oninput="setReview('p1',this.value)"><input placeholder="Top priority 2" value="${r.p2||''}" oninput="setReview('p2',this.value)" style="margin-top:8px"><input placeholder="Top priority 3" value="${r.p3||''}" oninput="setReview('p3',this.value)" style="margin-top:8px"><textarea placeholder="Habits to be built" oninput="setReview('build',this.value)">${r.build||''}</textarea><input type="number" step="0.1" placeholder="Sleep hours" value="${r.sleep||''}" oninput="setReview('sleep',this.value)"></div>
  <div class="card" id="nightBox"><h2>Night review</h2><textarea placeholder="Review of yesterday" oninput="setReview('yesterday',this.value)">${r.yesterday||''}</textarea><textarea placeholder="Something that made the day good" oninput="setReview('good',this.value)">${r.good||''}</textarea><textarea placeholder="A habit built" oninput="setReview('habitBuilt',this.value)">${r.habitBuilt||''}</textarea><textarea placeholder="Something I am grateful for" oninput="setReview('grateful',this.value)">${r.grateful||''}</textarea></div>
  <div class="card"><h2>Weekly summary</h2>${weekSummary}</div>`;
}
function setReview(k,v){ state.reviews[activeDate] ||= {}; state.reviews[activeDate][k]=v; persistOnly(); }
function toggleReview(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
function weeklySummary(){
  const d=dateFromKey(activeDate); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  let rows='';
  for(let i=0;i<7;i++){ const k=keyFromDate(d); const habitsDone=Object.values(state.habitChecks[k]||{}).filter(Boolean).length; const tasks=state.dailyTasks[k]||[]; rows += `<div class="item"><div class="title">${fmtDate(k)}</div><div class="meta">Habits: ${habitsDone}/${state.habits.length} · Daily tasks done: ${tasks.filter(t=>t.done).length}/${tasks.length} · Sleep: ${state.reviews[k]?.sleep||'-'}h</div></div>`; d.setDate(d.getDate()+1); }
  return `<div class="item"><div class="title">Daily task streak: ${dailyTaskStreak()} days</div></div>${rows}`;
}

function renderNotes(){ el('notes').innerHTML = `<div class="card"><h2>Notes section</h2><textarea placeholder="General notes, ideas, SOPs..." style="min-height:55vh" oninput="state.notes.general=this.value; persistOnly()">${state.notes.general||''}</textarea></div>`; }
function persistOnly(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='precision-backup.json'; a.click(); }
function escapeHtml(s=''){ return String(s).replace(/[&<>'"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }

function buildIcon(){
  const canvas=document.createElement('canvas'); canvas.width=512; canvas.height=512; const c=canvas.getContext('2d');
  c.fillStyle='#02070d'; c.fillRect(0,0,512,512);
  c.strokeStyle='#7ddfff'; c.lineWidth=18; c.shadowColor='rgba(125,223,255,.6)'; c.shadowBlur=26;
  c.beginPath(); c.arc(256,256,165,0,Math.PI*2); c.stroke();
  c.shadowBlur=0; c.fillStyle='#bdefff'; c.font='900 118px -apple-system, BlinkMacSystemFont, Segoe UI'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('90',256,264);
  c.strokeStyle='#7ddfff'; c.lineWidth=12; c.lineCap='round'; c.beginPath(); c.moveTo(256,256); c.lineTo(256,150); c.moveTo(256,256); c.lineTo(337,300); c.stroke();
  document.getElementById('appleIcon').href=canvas.toDataURL('image/png');
}
init();
</script>
</body>
</html>
