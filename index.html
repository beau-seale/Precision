<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Precision" />
<meta name="theme-color" content="#02070d" />
<title>Precision</title>
<link rel="apple-touch-icon" id="appleIcon" href="" />
<style>
:root{--bg:#02070d;--panel:#07111d;--panel2:#0b1725;--line:rgba(125,221,255,.18);--ice:#7ddfff;--ice2:#c9f4ff;--text:#edfaff;--muted:#87a5b4;--danger:#ff5d7a;--green:#72ffb6;--radius:18px;--shadow:0 18px 55px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at top,rgba(125,223,255,.14),transparent 38%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}button,input,textarea,select{font:inherit}.app{min-height:100vh;padding:env(safe-area-inset-top) 12px calc(92px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}header{position:sticky;top:0;z-index:20;padding:12px 0 10px;backdrop-filter:blur(18px);background:linear-gradient(to bottom,rgba(2,7,13,.96),rgba(2,7,13,.76),transparent)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:12px}.mark{width:54px;height:54px;border:1px solid var(--ice);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 22px rgba(125,223,255,.25);font-weight:900;color:var(--ice);letter-spacing:-2px;position:relative}.mark:before{content:"";position:absolute;top:7px;width:3px;height:13px;background:var(--ice);border-radius:3px}.brand h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.04em}.pill{border:1px solid var(--line);background:rgba(125,223,255,.06);color:var(--ice);border-radius:999px;padding:9px 12px;font-weight:800}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);border-radius:999px;padding:10px 13px;font-weight:800}.tab.active{background:rgba(125,223,255,.14);color:var(--text);border-color:rgba(125,223,255,.45);box-shadow:0 0 18px rgba(125,223,255,.08)}.section{display:none}.section.active{display:block}.hero{margin:10px 0 14px;border:1px solid rgba(125,223,255,.26);border-radius:26px;padding:18px;background:linear-gradient(145deg,rgba(125,223,255,.14),rgba(7,17,29,.92));box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border:1px solid rgba(125,223,255,.22);border-radius:50%;box-shadow:0 0 60px rgba(125,223,255,.12)}.eyebrow{color:var(--ice);font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:11px}.hero h2{font-size:30px;letter-spacing:-.04em;margin:7px 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.4}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{border:1px solid var(--line);border-radius:16px;background:rgba(2,7,13,.48);padding:10px}.metric b{display:block;font-size:22px;color:var(--ice)}.metric span{font-size:11px;color:var(--muted);font-weight:800}.card{border:1px solid var(--line);border-radius:var(--radius);background:rgba(7,17,29,.86);box-shadow:0 12px 35px rgba(0,0,0,.22);padding:14px;margin:12px 0}.card h3{margin:0 0 10px;font-size:20px;letter-spacing:-.02em}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea,select{width:100%;background:#030a12;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;outline:none}textarea{min-height:90px;resize:vertical}.btn{border:1px solid var(--line);background:rgba(125,223,255,.09);color:var(--ice);border-radius:14px;padding:11px 13px;font-weight:900}.btn.primary{background:linear-gradient(135deg,rgba(125,223,255,.25),rgba(125,223,255,.08));border-color:rgba(125,223,255,.55);color:var(--text)}.btn.danger{color:var(--danger);border-color:rgba(255,93,122,.35)}.btn.small{padding:7px 9px;border-radius:10px;font-size:12px}.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.datebar input{max-width:170px;text-align:center}.item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid rgba(125,223,255,.12);border-radius:14px;background:rgba(255,255,255,.025);margin:8px 0}.item.done{opacity:.55}.check{width:26px;height:26px;border:1px solid var(--ice);border-radius:8px;background:transparent;color:var(--bg);display:grid;place-items:center;flex:0 0 auto}.done .check{background:var(--ice)}.item-main{flex:1;min-width:0}.item-title{font-weight:850}.sub{font-size:12px;color:var(--muted)}.planner-tools{position:sticky;top:122px;z-index:15;background:rgba(2,7,13,.92);backdrop-filter:blur(14px);padding:8px 0}.timeblock{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:stretch;margin:4px 0}.time{color:var(--muted);font-size:12px;padding-top:12px}.slot{min-height:44px;border:1px solid rgba(125,223,255,.11);border-radius:12px;background:rgba(255,255,255,.02);padding:9px;color:var(--text)}.slot.merged{border-color:rgba(125,223,255,.52);background:rgba(125,223,255,.08);box-shadow:inset 3px 0 0 var(--ice)}.slot input{border:0;background:transparent;padding:0;border-radius:0}.merge-label{font-weight:900;color:var(--ice);margin-bottom:4px}.calendar-wrap{width:100%;overflow-x:hidden}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-head div{text-align:center;color:var(--muted);font-size:11px;font-weight:900;padding:7px 0}.day{min-height:92px;border:1px solid rgba(125,223,255,.16);border-radius:13px;background:rgba(255,255,255,.025);padding:7px;overflow:hidden}.day.other{opacity:.25}.day-num{font-size:12px;color:var(--ice);font-weight:900}.event{font-size:10px;line-height:1.15;border:1px solid rgba(125,223,255,.45);border-left:4px solid var(--ice);border-radius:7px;padding:3px 4px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;display:none;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);padding:24px 12px;overflow:auto}.modal.show{display:block}.sheet{max-width:620px;margin:0 auto;background:linear-gradient(160deg,#07111d,#02070d);border:1px solid rgba(125,223,255,.28);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.sheet h2{margin:8px 0;font-size:28px}.step{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:rgba(125,223,255,.05)}.step b{color:var(--ice)}.fab-help{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;border-radius:999px;border:1px solid rgba(125,223,255,.5);background:#061524;color:var(--ice);padding:10px 12px;font-weight:900}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(2,7,13,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto}.bottomnav button{font-size:11px;min-width:72px;padding:9px 8px;border-radius:14px}.colour-dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}@media(max-width:430px){.app{padding-left:8px;padding-right:8px}.brand h1{font-size:30px}.dash{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.day{min-height:82px;padding:5px}.event{font-size:9px}.top .pill{padding:8px 9px}.planner-tools{top:118px}}

/* v4 clean mobile side menu */
.app{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.menu-btn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:rgba(125,223,255,.07);color:var(--ice);font-size:26px;font-weight:900;display:grid;place-items:center}
.top{gap:8px}.brand{flex:1}.brand h1{font-size:30px}.tabs,.bottomnav{display:none!important}.fab-help{bottom:calc(18px + env(safe-area-inset-bottom));}
.drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);z-index:80;display:none}.drawerBackdrop.show{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,340px);background:linear-gradient(180deg,#07111d,#02070d);border-right:1px solid rgba(125,223,255,.24);z-index:90;transform:translateX(-104%);transition:.22s ease;box-shadow:28px 0 60px rgba(0,0,0,.48);padding:calc(18px + env(safe-area-inset-top)) 14px 18px;overflow:auto}.drawer.show{transform:translateX(0)}
.drawerTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.drawerTitle{font-size:22px;font-weight:950;letter-spacing:-.03em}.navItem{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);border-radius:16px;padding:14px;margin:8px 0;font-weight:900}.navItem.active{background:rgba(125,223,255,.15);border-color:rgba(125,223,255,.5);color:var(--ice)}
header{padding:10px 0 8px}.datebar{position:sticky;top:76px;z-index:18;background:rgba(2,7,13,.92);backdrop-filter:blur(14px);padding:8px 0}.planner-tools{top:138px}
@media(max-width:430px){.brand h1{font-size:28px}.mark{width:48px;height:48px}.hero h2{font-size:25px}.hero{padding:15px;border-radius:22px}.planner-tools{top:132px}.datebar input{max-width:155px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top"><button class="menu-btn" onclick="openMenu()" aria-label="Open menu">☰</button><div class="brand"><div class="mark">90</div><h1>Precision</h1></div><button class="pill" onclick="exportData()">Export</button></div>
</header>

<div class="hero" id="homeHero">
  <div class="eyebrow">Shift worker command system</div>
  <h2 id="heroTitle">Today’s Operating Picture</h2>
  <p>Lock the essentials, block the day, review the mission. Built around rotating shifts, not 9–5 life.</p>
  <div class="dash"><div class="metric"><b id="mTasks">0/0</b><span>Daily tasks</span></div><div class="metric"><b id="mHabits">0/0</b><span>Habits</span></div><div class="metric"><b id="mPlanner">0</b><span>Planned blocks</span></div></div>
</div>

<div class="datebar"><button class="btn" onclick="moveDate(-1)">‹</button><input type="date" id="selectedDate" onchange="setDate(this.value)"><button class="btn" onclick="moveDate(1)">›</button></div>

<section id="daily" class="section"></section>
<section id="planner" class="section"></section>
<section id="todo" class="section"></section>
<section id="calendar" class="section"></section>
<section id="shifts" class="section"></section>
<section id="habits" class="section"></section>
<section id="reviews" class="section"></section>
<section id="notes" class="section"></section>
</div>
<button class="fab-help" onclick="openHelp()">How to use</button>
<div class="drawerBackdrop" id="drawerBackdrop" onclick="closeMenu()"></div><aside class="drawer" id="drawer"><div class="drawerTop"><div class="drawerTitle">Menu</div><button class="btn small" onclick="closeMenu()">Close</button></div><div id="sideNav"></div></aside>
<div class="modal" id="modal"><div class="sheet" id="modalContent"></div></div>
<script>
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDate(s){let [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d)}
const todayStr=()=>fmtDate(new Date());
const times=[]; for(let h=0;h<24;h++) for(let m=0;m<60;m+=15) times.push(String(h).padStart(2,'0')+String(m).padStart(2,'0'));
const tabs=[['daily','Daily tasks'],['planner','Daily planner'],['todo','Todo lists'],['calendar','Calendar'],['shifts','Shifts'],['habits','Habits'],['reviews','Reviews'],['notes','Notes']];
const colours=['#7ddfff','#72ffb6','#ffd36e','#ff7aa8','#b58cff','#ff8f5a'];
let state=load(); let active='daily'; let selectedDate=todayStr(); let calDate=new Date('2026-01-01');
function load(){let s=localStorage.getItem('precision_v3'); if(s) return JSON.parse(s); return {onboarded:false,dailyTasks:[{id:id(),text:'Morning routine',created:todayStr(),deleted:null},{id:id(),text:'Plan top 3 priorities',created:todayStr(),deleted:null}],dailyDone:{},habits:[{id:id(),text:'Exercise'},{id:id(),text:'Hydration'},{id:id(),text:'Hot/cold therapy'},{id:id(),text:'Pray/mindfulness'}],habitDone:{},planner:{},todos:{Work:[],Home:[]},shifts:[],reviews:{},notes:{},calendarEvents:[]};}
function save(){localStorage.setItem('precision_v3',JSON.stringify(state)); render();}
function id(){return Math.random().toString(36).slice(2,10)}
function prettyDate(d){return parseDate(d).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}
function init(){ $('selectedDate').value=selectedDate; renderNav(); createIcon(); if(!state.onboarded) onboarding(); render();}
function renderNav(){let nav=$('sideNav'); if(nav) nav.innerHTML=tabs.map(t=>`<button class="navItem ${t[0]==active?'active':''}" onclick="switchTab('${t[0]}')">${t[1]}</button>`).join('')+`<button class="navItem" onclick="exportData()">Export backup</button>`}
function openMenu(){$('drawerBackdrop').classList.add('show');$('drawer').classList.add('show');renderNav()} function closeMenu(){$('drawerBackdrop').classList.remove('show');$('drawer').classList.remove('show')}
function switchTab(t){active=t; closeMenu(); renderNav(); render(); window.scrollTo({top:0,behavior:'smooth'});} function setDate(v){selectedDate=v; if(active==='calendar') calDate=parseDate(v); render()} function moveDate(n){let d=parseDate(selectedDate); d.setDate(d.getDate()+n); selectedDate=fmtDate(d); $('selectedDate').value=selectedDate; render()}
function visibleTasks(){return state.dailyTasks.filter(t=>selectedDate>=t.created && (!t.deleted || selectedDate<t.deleted));}
function taskDone(id){return !!(state.dailyDone[selectedDate]||{})[id]} function toggleTask(id){state.dailyDone[selectedDate]=state.dailyDone[selectedDate]||{}; state.dailyDone[selectedDate][id]=!state.dailyDone[selectedDate][id]; save()}
function addDailyTask(){let v=$('newDaily').value.trim(); if(!v)return; state.dailyTasks.push({id:id(),text:v,created:selectedDate,deleted:null}); save()} function deleteDailyTask(i){visibleTasks()[i].deleted=selectedDate; save()} function moveTask(i,dir){let vt=visibleTasks(); let task=vt[i], other=vt[i+dir]; if(!other)return; let a=state.dailyTasks.indexOf(task), b=state.dailyTasks.indexOf(other); [state.dailyTasks[a],state.dailyTasks[b]]=[state.dailyTasks[b],state.dailyTasks[a]]; save()}
function renderDaily(){let items=visibleTasks(); $('daily').innerHTML=`<div class="card"><div class="between"><h3>Daily checklist</h3><span class="sub">Repeats daily from date added. Deleted items stay visible on old dates.</span></div><div class="row"><input id="newDaily" placeholder="Add repeat task e.g. Morning routine"><button class="btn primary" onclick="addDailyTask()">Add</button></div>${items.map((t,i)=>`<div class="item ${taskDone(t.id)?'done':''}"><button class="check" onclick="toggleTask('${t.id}')">✓</button><div class="item-main"><div class="item-title">${esc(t.text)}</div><div class="sub">Active from ${t.created}</div></div><button class="btn small" onclick="moveTask(${i},-1)">↑</button><button class="btn small" onclick="moveTask(${i},1)">↓</button><button class="btn small danger" onclick="deleteDailyTask(${i})">Del</button></div>`).join('')}</div>`}
function plannerFor(d=selectedDate){state.planner[d]=state.planner[d]||{}; return state.planner[d]}
function setBlockRange(){let label=$('blockLabel').value.trim(); let start=$('blockStart').value, end=$('blockEnd').value; if(!label||!start||!end)return; let p=plannerFor(); let si=times.indexOf(start), ei=times.indexOf(end); if(ei<si) [si,ei]=[ei,si]; for(let i=si;i<=ei;i++) p[times[i]]=label; save(); setTimeout(()=>document.querySelector(`[data-time="${start}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),50)}
function clearBlockRange(){let start=$('blockStart').value, end=$('blockEnd').value; let p=plannerFor(); let si=times.indexOf(start), ei=times.indexOf(end); if(ei<si) [si,ei]=[ei,si]; for(let i=si;i<=ei;i++) delete p[times[i]]; save()}
function updateSlot(t,v){let p=plannerFor(); if(v.trim()) p[t]=v.trim(); else delete p[t]; localStorage.setItem('precision_v3',JSON.stringify(state)); renderHeroOnly();}
function goTime(){let t=$('goTime').value; document.querySelector(`[data-time="${t}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});}
function getMergedBlocks(d=selectedDate){let p=state.planner[d]||{}, out=[], cur=null; times.forEach((t,idx)=>{let v=p[t]||''; if(v && cur && cur.label==v && cur.endIdx==idx-1){cur.endIdx=idx;cur.end=t}else{if(cur)out.push(cur); cur=v?{label:v,start:t,end:t,startIdx:idx,endIdx:idx}:null}}); if(cur)out.push(cur); return out.map(b=>({...b,endDisplay:endOfBlock(b.endIdx)}));}
function endOfBlock(idx){let next=idx+1<times.length?times[idx+1]:'2400'; return next}
function renderPlanner(){let p=plannerFor(); let html=`<div class="card planner-tools"><h3>Daily planner</h3><div class="grid2"><div><label class="sub">Go to time</label><div class="row"><select id="goTime">${times.map(t=>`<option>${t}</option>`).join('')}</select><button class="btn" onclick="goTime()">Go</button></div></div><div><label class="sub">Quick block label</label><input id="blockLabel" placeholder="Sleep, Work, Training"></div><div><label class="sub">Start</label><select id="blockStart">${times.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label class="sub">End</label><select id="blockEnd">${times.map(t=>`<option>${t}</option>`).join('')}</select></div></div><div class="row wrap" style="margin-top:8px"><button class="btn primary" onclick="setBlockRange()">Auto-fill block</button><button class="btn danger" onclick="clearBlockRange()">Clear range</button></div></div>`;
let blocks=getMergedBlocks(), starts=Object.fromEntries(blocks.map(b=>[b.start,b])); let skipUntil=-1;
times.forEach((t,idx)=>{if(idx<skipUntil)return; let b=starts[t]; if(b){skipUntil=b.endIdx+1; html+=`<div class="timeblock" data-time="${t}"><div class="time">${b.start}<br>↓<br>${b.endDisplay}</div><div class="slot merged"><div class="merge-label">${esc(b.label)}</div><input value="${esc(b.label)}" onchange="updateSlot('${t}',this.value)" placeholder="Plan block"></div></div>`}else{html+=`<div class="timeblock" data-time="${t}"><div class="time">${t}</div><div class="slot"><input value="${esc(p[t]||'')}" onchange="updateSlot('${t}',this.value)" placeholder=""></div></div>`}}); $('planner').innerHTML=html;}
function renderTodo(){let lists=Object.keys(state.todos); $('todo').innerHTML=`<div class="card"><h3>Todo files</h3><div class="row"><input id="newList" placeholder="New file/list e.g. Business"><button class="btn primary" onclick="addList()">Add</button></div>${lists.map(name=>`<div class="card"><div class="between"><h3>${esc(name)}</h3><button class="btn small danger" onclick="delList('${esc(name)}')">Delete file</button></div><div class="grid2"><input id="todo-${esc(name)}" placeholder="New task"><select id="label-${esc(name)}"><option>Today</option><option>This week</option><option>This month</option></select></div><button class="btn primary" style="margin-top:8px" onclick="addTodo('${esc(name)}')">Add task</button>${state.todos[name].map((x,i)=>`<div class="item ${x.done?'done':''}"><button class="check" onclick="toggleTodo('${esc(name)}',${i})">✓</button><div class="item-main"><div class="item-title">${esc(x.text)}</div><div class="sub">${x.label}</div></div><button class="btn small danger" onclick="delTodo('${esc(name)}',${i})">Del</button></div>`).join('')}</div>`).join('')}</div>`}
function addList(){let v=$('newList').value.trim(); if(v&&!state.todos[v]){state.todos[v]=[]; save()}} function delList(n){delete state.todos[n]; save()} function addTodo(n){let v=$(`todo-${n}`).value.trim(); if(!v)return; state.todos[n].push({text:v,label:$(`label-${n}`).value,done:false}); save()} function toggleTodo(n,i){state.todos[n][i].done=!state.todos[n][i].done; save()} function delTodo(n,i){state.todos[n].splice(i,1); save()}
function renderCalendar(){let y=calDate.getFullYear(), m=calDate.getMonth(); let first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7)); let cells=[]; for(let i=0;i<42;i++){let d=new Date(start); d.setDate(start.getDate()+i); cells.push(d)} $('calendar').innerHTML=`<div class="card"><div class="between"><button class="btn" onclick="calMove(-1)">‹</button><h3>${calDate.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</h3><button class="btn" onclick="calMove(1)">›</button></div><div class="row wrap"><input id="calTitle" placeholder="Add calendar item"><input type="date" id="calItemDate" value="${selectedDate}"><select id="calColour">${colours.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><button class="btn primary" onclick="addCalEvent()">Add</button></div><div class="calendar-wrap"><div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells.map(d=>dayCell(d,m)).join('')}</div></div></div>`}
function dayCell(d,month){let ds=fmtDate(d); let ev=[...state.calendarEvents.filter(e=>e.date==ds),...state.shifts.filter(s=>s.date==ds).map(s=>({title:`Shift ${s.start}-${s.end}`,colour:'#7ddfff'})),...getMergedBlocks(ds).map(b=>({title:`${b.label} ${b.start}-${b.endDisplay}`,colour:'#7ddfff'}))]; return `<div class="day ${d.getMonth()!=month?'other':''}" onclick="selectedDate='${ds}';$('selectedDate').value=selectedDate;switchTab('planner')"><div class="day-num">${d.getDate()}</div>${ev.slice(0,5).map(e=>`<div class="event" style="border-left-color:${e.colour||'#7ddfff'}">${esc(e.title)}</div>`).join('')}</div>`}
function calMove(n){calDate.setMonth(calDate.getMonth()+n); render()} function addCalEvent(){let title=$('calTitle').value.trim(); if(!title)return; state.calendarEvents.push({id:id(),title,date:$('calItemDate').value,colour:$('calColour').value}); save()}
function renderShifts(){ $('shifts').innerHTML=`<div class="card"><h3>Shifts</h3><p class="sub">Add a shift here and it automatically appears in the calendar.</p><div class="grid2"><input type="date" id="shiftDate" value="${selectedDate}"><input id="shiftStart" placeholder="Start e.g. 0600"><input id="shiftEnd" placeholder="End e.g. 1800"><input id="shiftNote" placeholder="Note/location"></div><button class="btn primary" style="margin-top:8px" onclick="addShift()">Add shift</button>${state.shifts.map((s,i)=>`<div class="item"><div class="item-main"><div class="item-title">${s.date}: ${s.start}-${s.end}</div><div class="sub">${esc(s.note||'')}</div></div><button class="btn small danger" onclick="delShift(${i})">Del</button></div>`).join('')}</div>`}
function addShift(){state.shifts.push({date:$('shiftDate').value,start:$('shiftStart').value,end:$('shiftEnd').value,note:$('shiftNote').value}); save()} function delShift(i){state.shifts.splice(i,1); save()}
function habitDone(id){return !!(state.habitDone[selectedDate]||{})[id]} function toggleHabit(id){state.habitDone[selectedDate]=state.habitDone[selectedDate]||{}; state.habitDone[selectedDate][id]=!state.habitDone[selectedDate][id]; save()} function streak(id,type){let count=0,d=new Date(selectedDate+'T00:00'); while(true){let ds=fmtDate(d); let done=type=='habit'?!!(state.habitDone[ds]||{})[id]:!!(state.dailyDone[ds]||{})[id]; if(!done)break; count++; d.setDate(d.getDate()-1)} return count}
function renderHabits(){ $('habits').innerHTML=`<div class="card"><h3>Habits</h3><div class="row"><input id="newHabit" placeholder="Add habit"><button class="btn primary" onclick="addHabit()">Add</button></div>${state.habits.map((h,i)=>`<div class="item ${habitDone(h.id)?'done':''}"><button class="check" onclick="toggleHabit('${h.id}')">✓</button><div class="item-main"><div class="item-title">${esc(h.text)}</div><div class="sub">Streak: ${streak(h.id,'habit')} days</div></div><button class="btn small danger" onclick="delHabit(${i})">Del</button></div>`).join('')}</div>`} function addHabit(){let v=$('newHabit').value.trim(); if(v){state.habits.push({id:id(),text:v}); save()}} function delHabit(i){state.habits.splice(i,1); save()}
function renderReviews(){let r=state.reviews[selectedDate]||{}; $('reviews').innerHTML=`<div class="card"><h3>Morning review</h3><textarea id="top3" placeholder="Top 3 priorities">${esc(r.top3||'')}</textarea><textarea id="build" placeholder="Habits to be built">${esc(r.build||'')}</textarea><input id="sleep" placeholder="Sleep tracker e.g. 7.5 hours" value="${esc(r.sleep||'')}"></div><div class="card"><h3>Night review</h3><textarea id="yesterday" placeholder="Review of yesterday/today">${esc(r.yesterday||'')}</textarea><textarea id="good" placeholder="Something that made the day good">${esc(r.good||'')}</textarea><textarea id="built" placeholder="A habit built">${esc(r.built||'')}</textarea><textarea id="grateful" placeholder="Something I am grateful for">${esc(r.grateful||'')}</textarea><button class="btn primary" onclick="saveReview()">Save review</button></div><div class="card"><h3>Weekly summary</h3>${weeklySummary()}</div>`} function saveReview(){state.reviews[selectedDate]={top3:$('top3').value,build:$('build').value,sleep:$('sleep').value,yesterday:$('yesterday').value,good:$('good').value,built:$('built').value,grateful:$('grateful').value}; save()}
function weeklySummary(){let d=parseDate(selectedDate), start=new Date(d); start.setDate(d.getDate()-((d.getDay()+6)%7)); let out=''; for(let i=0;i<7;i++){let x=new Date(start); x.setDate(start.getDate()+i); let ds=fmtDate(x); let td=Object.values(state.dailyDone[ds]||{}).filter(Boolean).length, hd=Object.values(state.habitDone[ds]||{}).filter(Boolean).length; out+=`<div class="item"><div class="item-main"><div class="item-title">${prettyDate(ds)}</div><div class="sub">Tasks ${td} • Habits ${hd} • Planner blocks ${getMergedBlocks(ds).length}</div></div></div>`}return out}
function renderNotes(){state.notes[selectedDate]=state.notes[selectedDate]||''; $('notes').innerHTML=`<div class="card"><h3>Daily notes</h3><textarea id="noteBox" oninput="state.notes[selectedDate]=this.value;localStorage.setItem('precision_v3',JSON.stringify(state))" placeholder="Notes for ${prettyDate(selectedDate)}">${esc(state.notes[selectedDate])}</textarea></div>`}
function renderHeroOnly(){let tasks=visibleTasks(), td=tasks.filter(t=>taskDone(t.id)).length, hd=state.habits.filter(h=>habitDone(h.id)).length; $('mTasks').textContent=`${td}/${tasks.length}`; $('mHabits').textContent=`${hd}/${state.habits.length}`; $('mPlanner').textContent=getMergedBlocks().length; $('heroTitle').textContent=prettyDate(selectedDate);} 
function render(){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); $(active).classList.add('active'); $('selectedDate').value=selectedDate; renderHeroOnly(); renderDaily(); renderPlanner(); renderTodo(); renderCalendar(); renderShifts(); renderHabits(); renderReviews(); renderNotes();}
function helpText(){const map={daily:'Daily tasks are repeat items. Add Morning Routine once and it appears every day from that date forward. If you delete it, old days stay unchanged.',planner:'Use Quick Block to autofill a range, e.g. Sleep from 0000 to 0500. Matching blocks become one outlined block and appear on the calendar.',todo:'Create files like Work, Home, Business. Add tasks and label them Today, This week or This month.',calendar:'Calendar shows manual events, shifts, and daily planner blocks. Tap a day to jump to that day’s planner.',shifts:'Enter shift date/start/end and it automatically appears on the calendar.',habits:'Tick habits daily. Streaks count backwards from the selected day.',reviews:'Morning review sets priorities, sleep and habits. Night review captures wins, gratitude and lessons.',notes:'One notes page per day. Use it for loose thoughts or shift-specific info.'};return map[active]||''}
function openHelp(){modal(`<h2>${tabs.find(t=>t[0]==active)[1]}</h2><div class="step">${helpText()}</div><button class="btn primary" onclick="closeModal()">Got it</button>`)}
function onboarding(){modal(`<div class="mark" style="margin:auto">90</div><h2>Welcome to Precision</h2><p class="sub">A command system for shift workers. Here’s the quick start.</p><div class="step"><b>1. Daily tasks</b><br>Add repeat tasks like Morning Routine. They repeat forward only, so your old days stay accurate.</div><div class="step"><b>2. Planner blocks</b><br>Use Quick Block to enter Sleep 0000–0500 once. It fills the range and links to the calendar.</div><div class="step"><b>3. Shifts + calendar</b><br>Add shifts in the Shifts tab. They automatically appear on the calendar.</div><div class="step"><b>4. Reviews</b><br>Use morning and night reviews to keep the system focused.</div><div class="row"><button class="btn" onclick="state.onboarded=true;closeModal();localStorage.setItem('precision_v3',JSON.stringify(state))">Skip</button><button class="btn primary" onclick="state.onboarded=true;closeModal();localStorage.setItem('precision_v3',JSON.stringify(state))">Start</button></div>`)}
function modal(html){$('modalContent').innerHTML=html; $('modal').classList.add('show')} function closeModal(){$('modal').classList.remove('show')} $('modal').addEventListener('click',e=>{if(e.target.id=='modal')closeModal()});
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='precision-backup.json';a.click()}
function createIcon(){let svg=`<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' fill='%2302070d'/><circle cx='90' cy='90' r='62' fill='none' stroke='%237ddfff' stroke-width='8'/><line x1='90' y1='28' x2='90' y2='52' stroke='%237ddfff' stroke-width='8' stroke-linecap='round'/><text x='90' y='108' text-anchor='middle' font-family='Arial' font-size='46' font-weight='900' fill='%237ddfff'>90</text></svg>`;$('appleIcon').href='data:image/svg+xml,'+svg}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
init();
</script>
</body>
</html>
